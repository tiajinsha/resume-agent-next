name: ✨ 功能建议
description: 提议一个新功能或改进现有功能
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题?
      description: 用例驱动 — 先讲使用场景,再讲解决方案
      placeholder: |
        作为一个 HR,我希望能批量导出多位候选人的简历到 PDF,
        这样我可以直接发给业务部门评审,不用一份份下载。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你的方案(可选)
      description: 如果你已经想好怎么做了,简单写下来
      placeholder: |
        - 在 Dashboard 批量操作里加"导出 PDF 包"按钮
        - 用 jszip 打包 N 份 PDF
        - 文件命名:{候选人姓名}_{岗位}.pdf

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案(可选)
      description: 你考虑过其他做法吗?为什么不选?

  - type: dropdown
    id: priority
    attributes:
      label: 你觉得这个功能多重要?
      options:
        - "Nice to have(锦上添花)"
        - "Should have(应该有)"
        - "Must have(没有就用不下去)"
      default: 0
