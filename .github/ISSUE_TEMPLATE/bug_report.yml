name: 🐛 Bug 报告
description: 上报一个看到的问题或异常行为
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢报告问题!请尽量提供完整的复现信息,这样我们能更快定位修复。

  - type: textarea
    id: what-happened
    attributes:
      label: 问题现象
      description: 发生了什么?预期是什么?
      placeholder: |
        - 操作:点击候选人列表的"批量删除"
        - 预期:出现确认弹窗
        - 实际:页面无响应,控制台报错
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 一步步告诉我们如何重现这个问题
      placeholder: |
        1. 上传 X 份简历
        2. 在 Dashboard 选中 N 位候选人
        3. 点击"删除"
        4. 看到 ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 跑在哪里?浏览器?Node 版本?
      placeholder: |
        - OS: macOS 14 / Ubuntu 22 / Windows 11
        - Node: 20.x
        - 浏览器: Chrome 130
        - 部署方式: 本地 dev / Docker / 阿里云脚本
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图(可选)
      description: 浏览器控制台报错、PM2 日志、相关截图都可以贴在这里
      render: shell

  - type: checkboxes
    id: prechecks
    attributes:
      label: 检查项
      options:
        - label: 我搜索过 Issues,确认这不是重复
          required: true
        - label: 这是 Sift 思筛本身的问题,不是 Next.js / antd / DeepSeek 等上游
          required: false
