name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一 ref 重复 push 时取消旧的 run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck / Lint / Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LLM_STUB: "1"
      DATABASE_URL: ":memory:"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        # ubuntu-latest 自带 python3 + g++,better-sqlite3 能编译
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test (LLM_STUB=1)
        run: npm test

  # 可选:在 verify 通过后跑一次 build 当烟雾测试
  # 在仓库 Settings → Variables 加 RUN_BUILD_IN_CI=1 启用
  build:
    name: Next build (smoke)
    runs-on: ubuntu-latest
    needs: verify
    if: ${{ vars.RUN_BUILD_IN_CI == '1' }}
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: ":memory:"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - run: npm run build
